<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#f4f7fb" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0a0a0f" media="(prefers-color-scheme: dark)" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<meta
			name="description"
			content="BitOS — a local-first Nostr social client. Feed, chat, and relays."
		/>
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/icons/icon-192-192.png" />
		<link rel="mask-icon" href="/mask.svg" color="#0f172a" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="BitOS" />
		<!-- Preload the dark-mode logo so the splash swaps instantly. -->
		<link rel="preload" as="image" href="/icons/logo-white.png" />
		<!-- No-flash theme: apply stored color mode before first paint -->
		<script>
			(function () {
				try {
					var k = 'bitos:prefs';
					var raw = localStorage.getItem(k);
					var mode = 'dark';
					if (raw) {
						var p = JSON.parse(raw);
						if (p && p.mode) mode = p.mode;
					}
					var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
					var dark = mode === 'dark' || (mode === 'system' && prefersDark);
					document.documentElement.classList.toggle('dark', dark);
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- Instant splash: paints before the JS bundle loads; the SvelteKit
		     layout removes it (fade-out) as soon as the app mounts. -->
		<div id="boot-splash" role="status" aria-label="Loading BitOS">
			<div class="bs-inner">
				<!-- Brand lockup: hex badge (BitOS hex language) + official wordmark. -->
				<div class="bs-mark" aria-hidden="true">
					<!-- Perimeter trace: a compact system-online moment before the app mounts. -->
					<svg class="bs-boot-orbit" viewBox="0 0 100 100" aria-hidden="true">
						<polygon points="25,6.7 75,6.7 100,50 75,93.3 25,93.3 0,50" />
					</svg>
					<?xml version="1.0" encoding="UTF-8"?>
					<svg
						class="bs-symbol"
						xmlns="http://www.w3.org/2000/svg"
						width="664"
						height="297"
						viewBox="0 0 664 297"
						role="img"
						aria-labelledby="title desc"
					>
						<title id="title">BitOS lightning bolt</title>
						<desc id="desc">
							Lightning bolt extracted from the BitOS logo, drawn then revealed with a spark
						</desc>
						<path
							class="bs-bolt-fill"
							fill="#fff"
							fill-rule="evenodd"
							d="M 0,296
           C 37,254 69,222 99,195
           C 135,163 168,139 199,121
           L 313,51
           C 317,49 320,52 318,57
           L 306,119
           C 370,81 429,55 484,36
           C 547,14 606,3 664,0
           C 619,14 580,29 548,45
           C 508,65 472,83 441,99
           C 397,122 354,149 312,180
           L 231,243
           C 227,246 228,241 229,236
           L 241,160
           C 195,184 148,211 101,241
           C 65,264 31,282 0,296 Z"
						/>
						<path
							class="bs-bolt-trace bs-bolt-trace-wide"
							pathLength="1"
							d="M 0,296
           C 37,254 69,222 99,195
           C 135,163 168,139 199,121
           L 313,51
           C 317,49 320,52 318,57
           L 306,119
           C 370,81 429,55 484,36
           C 547,14 606,3 664,0
           C 619,14 580,29 548,45
           C 508,65 472,83 441,99
           C 397,122 354,149 312,180
           L 231,243
           C 227,246 228,241 229,236
           L 241,160
           C 195,184 148,211 101,241
           C 65,264 31,282 0,296 Z"
						/>
						<!-- Spark comet riding the stroke tip while the bolt draws. -->
						<circle class="bs-spark" r="16" fill="#fff" />
					</svg>
				</div>
				<!-- Official logo: dark artwork on light bg, white variant in dark mode. -->
				<img
					class="bs-logo bs-logo-light"
					src="/icons/logo.png"
					alt="BitOS"
					width="156"
					height="62"
				/>
				<img
					class="bs-logo bs-logo-dark"
					src="/icons/logo-white.png"
					alt="BitOS"
					width="1904"
					height="651"
				/>
				<div class="bs-pow" aria-hidden="true">
					<span></span><span></span><span></span><span></span><span></span><span></span
					><span></span>
				</div>
				<noscript><p class="bs-noscript">BitOS needs JavaScript to run.</p></noscript>
			</div>
			<style>
				#boot-splash {
					position: fixed;
					inset: 0;
					z-index: 9999;
					display: grid;
					place-items: center;
					background: #f4f7fb;
					pointer-events: none;
					transition:
						opacity 0.3s ease,
						visibility 0.3s ease;
				}
				html.dark #boot-splash {
					background: #0a0a0f;
				}
				.bs-inner {
					display: flex;
					flex-direction: column;
					align-items: center;
					gap: 16px;
				}
				/* Hex badge — regular flat-top hexagon, orange to match the progress bar. */
				.bs-mark {
					width: 60px;
					height: 60px;
					display: grid;
					place-items: center;
					position: relative;
					isolation: isolate;
					overflow: hidden;
					background: linear-gradient(135deg, #ffb51b, #f7931a);
					clip-path: polygon(25% 6.7%, 75% 6.7%, 100% 50%, 75% 93.3%, 25% 93.3%, 0% 50%);
					filter: drop-shadow(0 4px 18px rgb(247 147 26 / 0.5));
				}
				.bs-boot-orbit {
					position: absolute;
					z-index: 1;
					inset: 3px;
					width: calc(100% - 6px);
					height: calc(100% - 6px);
					pointer-events: none;
				}
				.bs-boot-orbit polygon {
					fill: none;
					stroke: rgb(255 255 255 / 0.72);
					stroke-width: 1.8;
					stroke-linejoin: round;
					stroke-dasharray: 260;
					stroke-dashoffset: 260;
					animation: bs-orbit-trace 2.4s cubic-bezier(0.22, 1, 0.36, 1) infinite;
				}
				.bs-mark::after {
					content: '';
					position: absolute;
					z-index: 0;
					inset: -45% -85%;
					background: linear-gradient(
						110deg,
						transparent 44%,
						rgb(255 255 255 / 0.4) 50%,
						transparent 56%
					);
					transform: translateX(-55%);
					animation: bs-charge-sheen 2.4s ease-in-out infinite;
				}
				.bs-mark > .bs-symbol {
					position: relative;
					z-index: 2;
					width: 34px;
					height: 34px;
				}
				/* Fill participates in the draw: dim while tracing, flash in when the
				   stroke completes — the reveal moment. */
				.bs-bolt-fill {
					transform-box: fill-box;
					transform-origin: center;
					animation: bs-bolt-fill 2.4s cubic-bezier(0.22, 1, 0.36, 1) infinite;
				}
				.bs-bolt-trace {
					fill: none;
					stroke: rgb(255 255 255 / 0.95);
					stroke-width: 18;
					stroke-linecap: round;
					stroke-linejoin: round;
					stroke-dasharray: 1;
					stroke-dashoffset: 1;
					animation: bs-bolt-draw 2.4s cubic-bezier(0.22, 1, 0.36, 1) infinite;
				}
				/* Spark comet riding the stroke tip (same path, same easing, so it stays
				   locked to the draw). Progressive enhancement — hides if unsupported. */
				.bs-spark {
					offset-path: path(
						'M 0,296 C 37,254 69,222 99,195 C 135,163 168,139 199,121 L 313,51 C 317,49 320,52 318,57 L 306,119 C 370,81 429,55 484,36 C 547,14 606,3 664,0 C 619,14 580,29 548,45 C 508,65 472,83 441,99 C 397,122 354,149 312,180 L 231,243 C 227,246 228,241 229,236 L 241,160 C 195,184 148,211 101,241 C 65,264 31,282 0,296 Z'
					);
					offset-rotate: 0deg;
					filter: drop-shadow(0 0 4px rgb(255 255 255 / 0.95));
					animation: bs-spark-run 2.4s cubic-bezier(0.22, 1, 0.36, 1) infinite;
				}
				.bs-logo {
					display: block;
					height: 26px;
					width: auto;
				}
				.bs-logo-dark {
					display: none;
				}
				html.dark .bs-logo-light {
					display: none;
				}
				html.dark .bs-logo-dark {
					display: block;
				}
				.bs-pow {
					display: flex;
					gap: 3px;
				}
				.bs-pow span {
					width: 3px;
					height: 9px;
					border-radius: 1px;
					background: #f7931a; /* warm-500 — orange, matches the top progress bar */
					opacity: 0.18;
					animation: bs-sweep 1.2s ease-in-out infinite;
				}
				.bs-pow span:nth-child(1) {
					animation-delay: 0s;
				}
				.bs-pow span:nth-child(2) {
					animation-delay: 0.12s;
				}
				.bs-pow span:nth-child(3) {
					animation-delay: 0.24s;
				}
				.bs-pow span:nth-child(4) {
					animation-delay: 0.36s;
				}
				.bs-pow span:nth-child(5) {
					animation-delay: 0.48s;
				}
				.bs-pow span:nth-child(6) {
					animation-delay: 0.6s;
				}
				.bs-pow span:nth-child(7) {
					animation-delay: 0.72s;
				}
				@keyframes bs-sweep {
					0%,
					100% {
						opacity: 0.18;
						box-shadow: 0 0 6px rgba(255, 117, 95, 0);
					}
					35% {
						opacity: 1;
						box-shadow: 0 0 6px rgba(255, 117, 95, 0.55);
					}
				}
				@keyframes bs-orbit-trace {
					0%,
					6% {
						stroke-dashoffset: 260;
						opacity: 0;
					}
					9% {
						opacity: 1;
					}
					26% {
						stroke-dashoffset: 0;
						opacity: 0.8;
					}
					30%,
					100% {
						stroke-dashoffset: 0;
						opacity: 0;
					}
				}
				@keyframes bs-charge-sheen {
					0%,
					10%,
					100% {
						transform: translateX(-55%);
						opacity: 0;
					}
					12% {
						opacity: 1;
					}
					28% {
						transform: translateX(55%);
						opacity: 0;
					}
				}
				/* Fill: dim while the stroke traces, flash in with a glow pop the
				   instant the draw completes, hold, then discharge. */
				@keyframes bs-bolt-fill {
					0%,
					26% {
						opacity: 0.3;
						transform: scale(1);
						filter: none;
					}
					36% {
						opacity: 1;
						transform: scale(1.08);
						filter: drop-shadow(0 0 6px rgb(255 255 255 / 0.9));
					}
					42% {
						transform: scale(1);
						filter: drop-shadow(0 0 2px rgb(255 255 255 / 0.3));
					}
					70% {
						opacity: 1;
					}
					84%,
					100% {
						opacity: 0.3;
						transform: scale(1);
						filter: none;
					}
				}
				@keyframes bs-bolt-draw {
					0%,
					11% {
						stroke-dashoffset: 1;
						opacity: 0;
					}
					13% {
						opacity: 1;
					}
					28% {
						stroke-dashoffset: 0;
						opacity: 0.95;
					}
					34%,
					100% {
						stroke-dashoffset: 0;
						opacity: 0;
					}
				}
				/* Spark comet: locked to the same 11→28% window and easing as the
				   stroke draw, so it rides exactly at the tip. */
				@keyframes bs-spark-run {
					0%,
					11% {
						offset-distance: 0%;
						opacity: 0;
					}
					13% {
						opacity: 1;
					}
					28% {
						offset-distance: 100%;
						opacity: 1;
					}
					32%,
					100% {
						offset-distance: 100%;
						opacity: 0;
					}
				}
				@media (prefers-reduced-motion: reduce) {
					.bs-mark,
					.bs-mark svg,
					.bs-mark::after,
					.bs-bolt-fill,
					.bs-bolt-trace,
					.bs-pow span {
						animation: none;
					}
					.bs-spark {
						display: none;
					}
					.bs-pow span {
						opacity: 0.6;
					}
				}
				#boot-splash.bs-out {
					opacity: 0;
					visibility: hidden;
				}
				.bs-noscript {
					margin: 0;
					font-size: 12px;
					font-family: 'JetBrains Mono', monospace;
					color: #a7afbf;
				}
			</style>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
