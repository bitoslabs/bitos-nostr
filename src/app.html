<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#f4f7fb" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0b0f1a" media="(prefers-color-scheme: dark)" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
			rel="stylesheet"
		/>
		<meta
			name="description"
			content="BitOS — a local-first Nostr social client. Feed, chat, and relays."
		/>
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="BitOS" />
		<!-- No-flash theme: apply stored color mode before first paint -->
		<script>
			(function () {
				try {
					var k = 'bitos:prefs';
					var raw = localStorage.getItem(k);
					var mode = 'system';
					if (raw) {
						var p = JSON.parse(raw);
						if (p && p.mode) mode = p.mode;
					}
					var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
					var dark = mode === 'dark' || (mode === 'system' && prefersDark);
					document.documentElement.classList.toggle('dark', dark);
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
