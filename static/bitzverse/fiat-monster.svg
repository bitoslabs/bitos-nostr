<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
	<!-- Bitzverse — FIAT MONSTER: the money printer beast (green eyes, brrr) -->
	<defs>
		<linearGradient id="fiatbody" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#15803d"/>
		</linearGradient>
	</defs>
	<!-- printer-paper body -->
	<path d="M 56 88 h 128 l 14 84 q 2 16 -14 16 h -128 q -16 0 -14 -16 z"
		fill="url(#fiatbody)" stroke="#3a2a10" stroke-width="6" stroke-linejoin="round"/>
	<!-- paper slot + escaping bills -->
	<rect x="76" y="76" width="88" height="14" rx="7" fill="#166534" stroke="#3a2a10" stroke-width="5"/>
	<g stroke="#3a2a10" stroke-width="4" stroke-linejoin="round">
		<rect x="84" y="34" width="44" height="22" rx="3" fill="#bbf7d0" transform="rotate(-8 106 45)"/>
		<rect x="128" y="26" width="40" height="20" rx="3" fill="#dcfce7" transform="rotate(6 148 36)"/>
	</g>
	<path d="M 96 40 h 20 M 96 48 h 14" stroke="#15803d" stroke-width="3" stroke-linecap="round" transform="rotate(-8 106 45)"/>
	<!-- angry print head -->
	<path d="M 84 118 l 22 8 M 156 118 l -22 8" stroke="#3a2a10" stroke-width="6" stroke-linecap="round"/>
	<ellipse cx="107" cy="138" rx="13" ry="15" fill="#fff" stroke="#3a2a10" stroke-width="5"/>
	<ellipse cx="133" cy="138" rx="13" ry="15" fill="#fff" stroke="#3a2a10" stroke-width="5"/>
	<circle cx="105" cy="140" r="5.5" fill="#16a34a"/>
	<circle cx="135" cy="140" r="5.5" fill="#16a34a"/>
	<!-- toothy output tray mouth -->
	<path d="M 92 164 q 28 18 56 0 l -4 12 q -24 12 -48 0 z" fill="#5b2d0e" stroke="#3a2a10" stroke-width="5"/>
	<path d="M 104 168 l 3 7 M 116 171 l 1 8 M 130 168 l -3 7" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
	<!-- stubby legs -->
	<path d="M 84 188 q -2 14 -8 20 M 156 188 q 2 14 8 20" stroke="#3a2a10" stroke-width="10" stroke-linecap="round" fill="none"/>
	<!-- BRRR steam -->
	<g fill="none" stroke="#4ade80" stroke-width="4" stroke-linecap="round" opacity="0.8">
		<path d="M 62 66 q -6 -12 2 -22"/>
		<path d="M 178 64 q 8 -10 4 -22"/>
	</g>
</svg>
