<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
	<!-- Bitzverse — RELAY ROAD: server-tower relay stations along the wire -->
	<defs>
		<linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#64748b"/><stop offset="1" stop-color="#334155"/>
		</linearGradient>
	</defs>
	<!-- the road: dashed relay wire -->
	<path d="M 12 152 q 108 -66 216 0" fill="none" stroke="#3a2a10" stroke-width="6"/>
	<path d="M 12 152 q 108 -66 216 0" fill="none" stroke="#a7f3d0" stroke-width="4" stroke-dasharray="10 12" stroke-linecap="round"/>
	<!-- relay towers -->
	<g fill="url(#tower)" stroke="#3a2a10" stroke-width="5" stroke-linejoin="round">
		<rect x="28" y="112" width="42" height="46" rx="5"/>
		<rect x="99" y="86" width="46" height="54" rx="5"/>
		<rect x="174" y="112" width="40" height="46" rx="5"/>
	</g>
	<!-- status LEDs -->
	<g stroke-linecap="round">
		<circle cx="41" cy="126" r="4" fill="#22c55e"/><circle cx="57" cy="126" r="4" fill="#22c55e"/>
		<circle cx="41" cy="140" r="4" fill="#f59e0b"/><circle cx="57" cy="140" r="4" fill="#22c55e"/>
		<circle cx="113" cy="102" r="4" fill="#22c55e"/><circle cx="131" cy="102" r="4" fill="#22c55e"/>
		<circle cx="113" cy="118" r="4" fill="#22c55e"/><circle cx="131" cy="118" r="4" fill="#ef4444"/>
		<circle cx="186" cy="126" r="4" fill="#22c55e"/><circle cx="202" cy="126" r="4" fill="#22c55e"/>
		<circle cx="186" cy="140" r="4" fill="#22c55e"/><circle cx="202" cy="140" r="4" fill="#22c55e"/>
	</g>
	<!-- antennas -->
	<g stroke="#3a2a10" stroke-width="4" stroke-linecap="round">
		<path d="M 49 112 v -18"/><path d="M 122 86 v -22"/><path d="M 194 112 v -16"/>
	</g>
	<g fill="none" stroke="#a7f3d0" stroke-width="3" stroke-linecap="round">
		<path d="M 41 90 a 11 11 0 0 1 16 0" opacity="0.9"/>
		<path d="M 113 60 a 13 13 0 0 1 18 0" opacity="0.9"/>
		<path d="M 187 92 a 10 10 0 0 1 14 0" opacity="0.9"/>
	</g>
	<!-- traveling packet -->
	<circle cx="200" cy="106" r="7" fill="#fde047" stroke="#3a2a10" stroke-width="4"/>
	<!-- road shading under towers -->
	<path d="M 20 176 q 100 -22 200 0" fill="none" stroke="#3a2a10" stroke-width="4" opacity="0.35" stroke-linecap="round"/>
</svg>
