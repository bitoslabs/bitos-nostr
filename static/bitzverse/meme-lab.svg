<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
	<!-- Bitzverse — MEME LAB: where the memes are cooked (flask + formula) -->
	<defs>
		<linearGradient id="goo" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/>
		</linearGradient>
	</defs>
	<!-- lab bench -->
	<path d="M 34 204 h 172 l -8 -14 h -156 z" fill="#78716c" stroke="#3a2a10" stroke-width="5" stroke-linejoin="round"/>
	<!-- flask -->
	<path d="M 104 40 h 18 v 44 l 34 66 a 14 14 0 0 1 -12 22 h -62 a 14 14 0 0 1 -12 -22 l 34 -66 z"
		fill="#fffdf4" stroke="#3a2a10" stroke-width="6" stroke-linejoin="round"/>
	<!-- meme goo -->
	<path d="M 88 128 q 24 14 48 0 l 12 24 a 14 14 0 0 1 -12 20 h -48 a 14 14 0 0 1 -12 -20 z"
		fill="url(#goo)" opacity="0.95"/>
	<!-- bubbles (tiny memes escaping) -->
	<circle cx="112" cy="120" r="4" fill="#c4b5fd"/>
	<circle cx="122" cy="106" r="3" fill="#c4b5fd"/>
	<circle cx="117" cy="92" r="2.4" fill="#ddd6fe"/>
	<!-- flask lip ticks -->
	<path d="M 100 44 v 8 M 108 44 v 8 M 116 44 v 8 M 124 44 v 8" stroke="#3a2a10" stroke-width="3" stroke-linecap="round"/>
	<!-- formula board -->
	<rect x="152" y="52" width="66" height="52" rx="6" fill="#fffdf4" stroke="#3a2a10" stroke-width="5" transform="rotate(6 185 78)"/>
	<g transform="rotate(6 185 78)" fill="none" stroke="#3a2a10" stroke-width="4" stroke-linecap="round">
		<path d="M 162 66 h 30 M 162 78 h 44 M 162 90 h 22"/>
	</g>
	<text x="196" y="70" transform="rotate(6 185 78)" font-family="monospace" font-size="14" font-weight="bold" fill="#7c3aed">₿</text>
	<!-- test tube rack -->
	<g stroke="#3a2a10" stroke-width="4" fill="none" stroke-linecap="round">
		<path d="M 44 190 v -34 M 44 156 a 7 7 0 0 1 14 0 v 34"/>
		<path d="M 66 190 v -40 M 66 150 a 7 7 0 0 1 14 0 v 40"/>
	</g>
	<path d="M 44 168 a 7 7 0 0 1 14 0 v 8 h -14 z" fill="#fbbf24"/>
	<path d="M 66 174 a 7 7 0 0 1 14 0 v 6 h -14 z" fill="#f97316"/>
	<!-- spark -->
	<path d="M 74 96 l 6 10 M 92 84 l 1 11" stroke="#ffb020" stroke-width="4" stroke-linecap="round"/>
</svg>
