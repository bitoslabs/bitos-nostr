<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
	<!-- Bitzverse — NOSTRAL PORTAL: a key-ringed portal into the relayscape -->
	<defs>
		<radialGradient id="portal" cx="0.5" cy="0.45" r="0.65">
			<stop offset="0" stop-color="#8b5cf6"/><stop offset="0.6" stop-color="#6d28d9"/><stop offset="1" stop-color="#3b0764"/>
		</radialGradient>
	</defs>
	<!-- outer ring -->
	<circle cx="120" cy="116" r="78" fill="url(#portal)" stroke="#3a2a10" stroke-width="6"/>
	<!-- inner swirl -->
	<path d="M 120 52 a 64 64 0 0 1 64 64 a 48 48 0 0 1 -48 48 a 34 34 0 0 1 -34 -34
		a 22 22 0 0 1 22 -22 a 14 14 0 0 1 14 14 a 8 8 0 0 1 -8 8"
		fill="none" stroke="#c4b5fd" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
	<!-- spark constellation inside -->
	<g fill="#fde047">
		<circle cx="140" cy="88" r="4"/>
		<circle cx="96" cy="132" r="3"/>
		<circle cx="150" cy="140" r="3"/>
	</g>
	<path d="M 140 80 l 3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z" fill="#fff" opacity="0.9"/>
	<!-- portal base -->
	<path d="M 76 190 q 44 -18 88 0 l 6 14 q -50 14 -100 0 z" fill="#78716c" stroke="#3a2a10" stroke-width="6" stroke-linejoin="round"/>
	<!-- key ring + npub key fob -->
	<circle cx="120" cy="216" r="10" fill="none" stroke="#3a2a10" stroke-width="6"/>
	<rect x="152" y="200" width="34" height="20" rx="5" fill="#f7b32b" stroke="#3a2a10" stroke-width="5"/>
	<text x="169" y="214" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#3a2a10">npub</text>
</svg>
