<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
	<!-- Bitz Buddy — SHOCK: huge spark-eyes, open mouth, sweat drop -->
	<defs>
		<radialGradient id="coin" cx="0.38" cy="0.32" r="0.9">
			<stop offset="0" stop-color="#ffd968"/>
			<stop offset="0.55" stop-color="#f7b32b"/>
			<stop offset="1" stop-color="#e09415"/>
		</radialGradient>
		<linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#ffe9a3"/>
			<stop offset="1" stop-color="#d98812"/>
		</linearGradient>
	</defs>
	<g stroke="#ffb020" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.9">
		<path d="M 34 60 l -12 -7"/><path d="M 30 84 l -14 1"/>
		<path d="M 206 60 l 12 -7"/><path d="M 210 84 l 14 1"/>
	</g>
	<g stroke="#3a2a10" stroke-width="14" stroke-linecap="round" fill="none">
		<path d="M 98 190 q 3 20 -4 30"/><path d="M 142 190 q -3 20 4 30"/>
	</g>
	<g fill="#ff7a1a" stroke="#3a2a10" stroke-width="5" stroke-linejoin="round">
		<path d="M 70 226 q 12 -8 26 -2 l 2 8 q -16 6 -28 2 z"/>
		<path d="M 170 226 q -12 -8 -26 -2 l -2 8 q 16 6 28 2 z"/>
	</g>
	<!-- arms thrown up -->
	<g stroke="#3a2a10" stroke-width="13" stroke-linecap="round" fill="none">
		<path d="M 46 128 q -18 -14 -18 -34"/>
		<path d="M 194 128 q 18 -14 18 -34"/>
	</g>
	<circle cx="28" cy="88" r="11" fill="#ffd968" stroke="#3a2a10" stroke-width="5"/>
	<circle cx="212" cy="88" r="11" fill="#ffd968" stroke="#3a2a10" stroke-width="5"/>
	<circle cx="120" cy="120" r="96" fill="url(#rim)" stroke="#3a2a10" stroke-width="6"/>
	<circle cx="120" cy="120" r="82" fill="url(#coin)" stroke="#8a5a0a" stroke-width="3"/>
	<!-- maximal shock eyes (bigger than base, constricted pupils) -->
	<ellipse cx="93" cy="102" rx="26" ry="30" fill="#fff" stroke="#3a2a10" stroke-width="5"/>
	<ellipse cx="147" cy="102" rx="26" ry="30" fill="#fff" stroke="#3a2a10" stroke-width="5"/>
	<circle cx="93" cy="104" r="6" fill="#241804"/>
	<circle cx="147" cy="104" r="6" fill="#241804"/>
	<circle cx="91" cy="99" r="2.6" fill="#fff"/><circle cx="145" cy="99" r="2.6" fill="#fff"/>
	<!-- dropped jaw -->
	<ellipse cx="120" cy="152" rx="15" ry="18" fill="#5b2d0e" stroke="#3a2a10" stroke-width="5"/>
	<ellipse cx="120" cy="160" rx="9" ry="8" fill="#ff8f6b"/>
	<!-- sweat drop -->
	<path d="M 178 66 q 8 12 0 17 q -9 -5 0 -17 z" fill="#7dd3fc" stroke="#0c4a6e" stroke-width="3"/>
</svg>
