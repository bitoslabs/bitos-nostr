<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
	<!-- Bitz Buddy — HODL ZEN: closed serene eyes, floating, tiny HODL sign -->
	<defs>
		<radialGradient id="coin" cx="0.38" cy="0.32" r="0.9">
			<stop offset="0" stop-color="#ffd968"/><stop offset="0.55" stop-color="#f7b32b"/><stop offset="1" stop-color="#e09415"/>
		</radialGradient>
		<linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#ffe9a3"/><stop offset="1" stop-color="#d98812"/>
		</linearGradient>
	</defs>
	<!-- zen aura -->
	<ellipse cx="120" cy="128" rx="108" ry="100" fill="none" stroke="#a7f3d0" stroke-width="3" opacity="0.5"/>
	<ellipse cx="120" cy="128" rx="122" ry="112" fill="none" stroke="#a7f3d0" stroke-width="2" opacity="0.3"/>
	<!-- calm sparks -->
	<g stroke="#ffb020" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.6">
		<path d="M 34 60 l -12 -7"/><path d="M 206 60 l 12 -7"/>
	</g>
	<!-- legs crossed in meditation -->
	<g stroke="#3a2a10" stroke-width="14" stroke-linecap="round" fill="none">
		<path d="M 96 196 q 26 -14 48 0"/>
		<path d="M 100 202 q 22 8 40 -4"/>
	</g>
	<!-- hands palms together (pranam) -->
	<g stroke="#3a2a10" stroke-width="11" stroke-linecap="round" fill="none">
		<path d="M 60 140 q 20 -6 34 -20"/>
		<path d="M 96 118 l 4 -6"/>
		<path d="M 124 112 l 4 6"/>
		<path d="M 146 120 q 14 14 34 20"/>
	</g>
	<path d="M 98 108 q 22 -14 44 0 l -3 8 q -19 -11 -38 0 z" fill="#ffd968" stroke="#3a2a10" stroke-width="4"/>
	<circle cx="120" cy="112" r="72" fill="url(#rim)" stroke="#3a2a10" stroke-width="6"/>
	<circle cx="120" cy="112" r="82" fill="none" stroke="#8a5a0a" stroke-width="3"/>
	<!-- glow halo -->
	<path d="M 120 18 q 6 12 0 18 q -7 -6 0 -18 z" fill="#a7f3d0" stroke="#065f46" stroke-width="3"/>
	<!-- closed serene eyes -->
	<path d="M 76 106 q 17 10 34 0" fill="none" stroke="#3a2a10" stroke-width="6" stroke-linecap="round"/>
	<path d="M 130 106 q 17 10 34 0" fill="none" stroke="#3a2a10" stroke-width="6" stroke-linecap="round"/>
	<!-- gentle smile -->
	<path d="M 104 138 q 16 12 32 0" fill="none" stroke="#3a2a10" stroke-width="5" stroke-linecap="round"/>
	<!-- floating hint lines -->
	<g stroke="#a7f3d0" stroke-width="3" stroke-linecap="round" opacity="0.7">
		<path d="M 44 176 q -8 6 -6 14"/>
		<path d="M 196 176 q 8 6 6 14"/>
	</g>
</svg>
