<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
	<!-- Bitz Buddy — DEAD INSIDE 💀: blank dot eyes, flat line mouth, grey aura -->
	<defs>
		<radialGradient id="coin" cx="0.38" cy="0.32" r="0.9">
			<stop offset="0" stop-color="#e8d8a8"/><stop offset="0.55" stop-color="#cbb383"/><stop offset="1" stop-color="#b09a68"/>
		</radialGradient>
		<linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#d9cba6"/><stop offset="1" stop-color="#9c8a5e"/>
		</linearGradient>
	</defs>
	<!-- desaturated sparks -->
	<g stroke="#b8a37c" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.7">
		<path d="M 34 60 l -12 -7"/><path d="M 30 84 l -14 1"/>
		<path d="M 206 60 l 12 -7"/><path d="M 210 84 l 14 1"/>
	</g>
	<!-- slumped legs -->
	<g stroke="#3a2a10" stroke-width="14" stroke-linecap="round" fill="none">
		<path d="M 98 190 q 3 20 -4 30"/><path d="M 142 190 q -3 20 4 30"/>
	</g>
	<g fill="#c26a1c" stroke="#3a2a10" stroke-width="5" stroke-linejoin="round">
		<path d="M 70 226 q 12 -8 26 -2 l 2 8 q -16 6 -28 2 z"/>
		<path d="M 170 226 q -12 -8 -26 -2 l -2 8 q 16 6 28 2 z"/>
	</g>
	<!-- arms hanging limp -->
	<g stroke="#3a2a10" stroke-width="13" stroke-linecap="round" fill="none">
		<path d="M 44 132 q -16 20 -14 38"/>
		<path d="M 196 132 q 16 20 14 38"/>
	</g>
	<circle cx="30" cy="174" r="11" fill="#cbb383" stroke="#3a2a10" stroke-width="5"/>
	<circle cx="210" cy="174" r="11" fill="#cbb383" stroke="#3a2a10" stroke-width="5"/>
	<circle cx="120" cy="120" r="96" fill="url(#rim)" stroke="#3a2a10" stroke-width="6"/>
	<circle cx="120" cy="120" r="82" fill="url(#coin)" stroke="#7a6844" stroke-width="3"/>
	<!-- blank dot eyes -->
	<circle cx="93" cy="104" r="7" fill="#241804"/>
	<circle cx="147" cy="104" r="7" fill="#241804"/>
	<!-- flat line mouth -->
	<path d="M 98 150 h 44" stroke="#3a2a10" stroke-width="6" stroke-linecap="round"/>
</svg>
