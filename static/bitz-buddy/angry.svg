<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
	<!-- Bitz Buddy — ANGRY: furrowed brows, gritted teeth, anger lines -->
	<defs>
		<radialGradient id="coin" cx="0.38" cy="0.32" r="0.9">
			<stop offset="0" stop-color="#ffd968"/><stop offset="0.55" stop-color="#f7b32b"/><stop offset="1" stop-color="#e09415"/>
		</radialGradient>
		<linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#ffe9a3"/><stop offset="1" stop-color="#d98812"/>
		</linearGradient>
	</defs>
	<!-- anger marks -->
	<g fill="none" stroke="#ef4444" stroke-width="5" stroke-linecap="round">
		<path d="M 40 42 l 6 12"/><path d="M 58 32 l 1 13"/>
		<path d="M 200 42 l -6 12"/><path d="M 182 32 l -1 13"/>
	</g>
	<g stroke="#ffb020" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.9">
		<path d="M 34 60 l -12 -7"/><path d="M 30 84 l -14 1"/>
		<path d="M 206 60 l 12 -7"/><path d="M 210 84 l 14 1"/>
	</g>
	<!-- stomping legs -->
	<g stroke="#3a2a10" stroke-width="14" stroke-linecap="round" fill="none">
		<path d="M 98 190 q 3 20 -4 30"/><path d="M 142 190 q -3 20 4 30"/>
	</g>
	<g fill="#ff7a1a" stroke="#3a2a10" stroke-width="5" stroke-linejoin="round">
		<path d="M 70 226 q 12 -8 26 -2 l 2 8 q -16 6 -28 2 z"/>
		<path d="M 170 226 q -12 -8 -26 -2 l -2 8 q 16 6 28 2 z"/>
	</g>
	<!-- fists clenched at sides -->
	<g stroke="#3a2a10" stroke-width="13" stroke-linecap="round" fill="none">
		<path d="M 44 130 q -16 12 -16 30"/>
		<path d="M 196 130 q 16 12 16 30"/>
	</g>
	<circle cx="28" cy="164" r="12" fill="#ffd968" stroke="#3a2a10" stroke-width="5"/>
	<circle cx="212" cy="164" r="12" fill="#ffd968" stroke="#3a2a10" stroke-width="5"/>
	<circle cx="120" cy="120" r="96" fill="url(#rim)" stroke="#3a2a10" stroke-width="6"/>
	<circle cx="120" cy="120" r="82" fill="url(#coin)" stroke="#8a5a0a" stroke-width="3"/>
	<!-- furrowed brows -->
	<path d="M 72 82 l 34 10" stroke="#3a2a10" stroke-width="7" stroke-linecap="round"/>
	<path d="M 168 82 l -34 10" stroke="#3a2a10" stroke-width="7" stroke-linecap="round"/>
	<!-- narrowed eyes -->
	<ellipse cx="93" cy="106" rx="17" ry="18" fill="#fff" stroke="#3a2a10" stroke-width="5"/>
	<ellipse cx="147" cy="106" rx="17" ry="18" fill="#fff" stroke="#3a2a10" stroke-width="5"/>
	<circle cx="90" cy="108" r="7.5" fill="#241804"/>
	<circle cx="144" cy="108" r="7.5" fill="#241804"/>
	<!-- gritted teeth mouth -->
	<path d="M 94 146 q 26 16 52 0 l -4 12 q -22 10 -44 0 z" fill="#5b2d0e" stroke="#3a2a10" stroke-width="5"/>
	<g stroke="#fff" stroke-width="3">
		<path d="M 102 150 l 0 9"/><path d="M 112 153 l 0 9"/><path d="M 122 154 l 0 9"/><path d="M 132 152 l 0 9"/>
	</g>
</svg>
