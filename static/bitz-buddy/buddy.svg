<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
	<!-- Bitz Buddy — base front pose (spec tp-bitcoin.md §16)
	     round coin body · huge expressive eyes · dark clean outline
	     tiny orange sneakers · lightning sparks · playful smile -->
	<defs>
		<radialGradient id="coin" cx="0.38" cy="0.32" r="0.9">
			<stop offset="0" stop-color="#ffd968"/>
			<stop offset="0.55" stop-color="#f7b32b"/>
			<stop offset="1" stop-color="#e09415"/>
		</radialGradient>
		<linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#ffe9a3"/>
			<stop offset="1" stop-color="#d98812"/>
		</linearGradient>
	</defs>

	<!-- lightning sparks (signature) -->
	<g stroke="#ffb020" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.9">
		<path d="M 34 60 l -12 -7"/>
		<path d="M 30 84 l -14 1"/>
		<path d="M 206 60 l 12 -7"/>
		<path d="M 210 84 l 14 1"/>
	</g>
	<g fill="#ffd968" stroke="#8a5a0a" stroke-width="3" stroke-linejoin="round">
		<path d="M 38 46 l 6 9 h -5 l 6 9 -14 -11 h 6 z"/>
		<path d="M 202 46 l -6 9 h 5 l -6 9 14 -11 h -6 z"/>
	</g>

	<!-- legs + orange sneakers (signature) -->
	<g stroke="#3a2a10" stroke-width="14" stroke-linecap="round" fill="none">
		<path d="M 98 190 q 3 20 -4 30"/>
		<path d="M 142 190 q -3 20 4 30"/>
	</g>
	<g fill="#ff7a1a" stroke="#3a2a10" stroke-width="5" stroke-linejoin="round">
		<path d="M 70 226 q 12 -8 26 -2 l 2 8 q -16 6 -28 2 z"/>
		<path d="M 170 226 q -12 -8 -26 -2 l -2 8 q 16 6 28 2 z"/>
	</g>
	<g stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.85">
		<path d="M 76 227 l 14 -1"/>
		<path d="M 164 227 l -14 -1"/>
	</g>

	<!-- stretchy arms (signature: expressive, noodle-limbed) -->
	<g stroke="#3a2a10" stroke-width="13" stroke-linecap="round" fill="none">
		<path d="M 42 132 q -18 8 -22 26"/>
		<path d="M 198 132 q 18 8 22 26"/>
	</g>
	<circle cx="18" cy="162" r="11" fill="#ffd968" stroke="#3a2a10" stroke-width="5"/>
	<circle cx="222" cy="162" r="11" fill="#ffd968" stroke="#3a2a10" stroke-width="5"/>

	<!-- coin body -->
	<circle cx="120" cy="120" r="96" fill="url(#rim)" stroke="#3a2a10" stroke-width="6"/>
	<circle cx="120" cy="120" r="82" fill="url(#coin)" stroke="#8a5a0a" stroke-width="3"/>

	<!-- subtle inner glyph hint (₿ silhouette, not overpowering) -->
	<g opacity="0.10" fill="#8a5a0a" transform="translate(120 122) scale(2.1) translate(-14 -17)">
		<path d="M 13 4 h -4 v -3 h 4 z M 13 8 h -4 v 3 h 4 z M 11 -6 h 3 v 19 h -3 z M 8 -3 h 3 v 3 h -3 z M 8 3 h 3 v 3 h -3 z M 6 0 h 3 v 3 h -3 z" transform="scale(1.6)"/>
	</g>

	<!-- huge expressive eyes (signature) -->
	<g>
		<ellipse cx="93" cy="104" rx="21" ry="25" fill="#fff" stroke="#3a2a10" stroke-width="5"/>
		<ellipse cx="147" cy="104" rx="21" ry="25" fill="#fff" stroke="#3a2a10" stroke-width="5"/>
		<circle cx="97" cy="108" r="9" fill="#241804"/>
		<circle cx="151" cy="108" r="9" fill="#241804"/>
		<!-- sparkle highlights -->
		<circle cx="94" cy="103" r="3.4" fill="#fff"/>
		<circle cx="148" cy="103" r="3.4" fill="#fff"/>
	</g>

	<!-- blush -->
	<ellipse cx="74" cy="136" rx="11" ry="6" fill="#ff9d5c" opacity="0.55"/>
	<ellipse cx="166" cy="136" rx="11" ry="6" fill="#ff9d5c" opacity="0.55"/>

	<!-- playful smile -->
	<path d="M 96 144 q 24 20 48 0" fill="none" stroke="#3a2a10" stroke-width="6" stroke-linecap="round"/>
</svg>
